---
- name: Allow required ports first
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_ports }}"

- name: Deny all other incoming traffic by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Enable ufw
  community.general.ufw:
    state: enabled
