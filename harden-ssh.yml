- hosts: all
  become: true
  vars:
    ssh_service: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
  tasks:
    - name: Harden SSH settings
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh
  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: "{{ ssh_service }}"
        state: restarted
